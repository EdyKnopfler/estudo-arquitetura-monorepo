server:
  port: ${RESERVAS_EXTERNO_HOTEL_PORT:8082}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/externo_hotel
    hikari:
      pool-name: ExternoHotelPool

internal-backend:
  clients:
    - client-id: ${RESERVAS_EXTERNO_HOTEL_ID:reservasExternoHotelId}
      client-secret: ${RESERVAS_EXTERNO_HOTEL_SECRET:reservasExternoHotelId}