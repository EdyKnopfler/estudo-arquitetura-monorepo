services:

  # Infraestrutura
  db:
    image: postgres:18.1-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: tanto_faz_so_pra_dev
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres_db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - ./databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro
      - ./pgdata:/var/lib/postgresql/18/docker

  broker:
    image: rabbitmq:4.2.2-management-alpine
    ports:
      - "${BROKER_PORT}:${BROKER_PORT}"
      - "${BROKER_PORT_WEB}:${BROKER_PORT_WEB}"
    volumes:
      - ./rabbitmqdata:/var/lib/rabbitmq/mnesia/
    environment:
      RABBITMQ_NODE_PORT: ${BROKER_PORT}
      RABBITMQ_DEFAULT_USER: ${BROKER_USER}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /

  # Simulação de serviços externos instáveis
  pagamento-externo:
    build:
      context: .
      dockerfile: pagamento-externo/Dockerfile
    env_file:
      - .env
    ports:
      - "${PAGAMENTO_EXTERNO_PORT}:${PAGAMENTO_EXTERNO_PORT}"
    depends_on:
      - db
  
  reservas-externo-hotel:
    build:
      context: .
      dockerfile: reservas-externo/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_EXTERNO_HOTEL_PORT}:${RESERVAS_EXTERNO_HOTEL_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: hotel
    depends_on:
      - db
  
  reservas-externo-voo:
    build:
      context: .
      dockerfile: reservas-externo/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_EXTERNO_VOO_PORT}:${RESERVAS_EXTERNO_VOO_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: voo
    depends_on:
      - db

  # Serviços internos da aplicação
  clientes:
    build:
      context: .
      dockerfile: clientes/Dockerfile
    env_file:
      - .env
    ports:
      - "${CLIENTES_PORT}:${CLIENTES_PORT}"
    depends_on:
      - db

  pagamento-interno-web:
    build:
      context: .
      dockerfile: pagamento-interno-web/Dockerfile
    env_file:
      - .env
    ports:
      - "${PAGAMENTO_INTERNO_PORT}:${PAGAMENTO_INTERNO_PORT}"
    depends_on:
      - db
  
  reservas-interno-web-hotel:
    build:
      context: .
      dockerfile: reservas-interno-web/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_INTERNO_WEB_HOTEL_PORT}:${RESERVAS_INTERNO_WEB_HOTEL_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: hotel
    depends_on:
      - db

  reservas-interno-web-voo:
    build:
      context: .
      dockerfile: reservas-interno-web/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_INTERNO_WEB_VOO_PORT}:${RESERVAS_INTERNO_WEB_VOO_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: voo
    depends_on:
      - db

  sessaocompra-web:
    build:
      context: .
      dockerfile: sessaocompra-web/Dockerfile
    env_file:
      - .env
    ports:
      - "${SESSAO_COMPRA_WEB_PORT}:${SESSAO_COMPRA_WEB_PORT}"
    depends_on:
      - db

  # Serviços SAGAS
  reservas-interno-sagas-hotel:
    build:
      context: .
      dockerfile: reservas-interno-sagas/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: hotel
    depends_on:
      - db
      - broker
  
  reservas-interno-sagas-voo:
    build:
      context: .
      dockerfile: reservas-interno-sagas/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: voo
    depends_on:
      - db
      - broker

  # TODO serviço SAGAS de pagamento (interno)

  # Timeout de limpeza de reservas não confirmadas
  sessaocompra-timeout:
    build:
      context: .
      dockerfile: sessaocompra-timeout/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
