services:

  # Infraestrutura
  db:
    image: postgres:18.1-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: tanto_faz_so_pra_dev
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres_db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - ./databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro
      - pgdata:/var/lib/postgresql/18/docker

  broker:
    image: rabbitmq:4.2.2-management-alpine
    ports:
      - "${BROKER_PORT}:${BROKER_PORT}"
      - "${BROKER_PORT_WEB}:${BROKER_PORT_WEB}"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq/mnesia/
    environment:
      RABBITMQ_NODE_PORT: ${BROKER_PORT}
      RABBITMQ_DEFAULT_USER: ${BROKER_USER}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      # RabbitMQ (Erlang VM + plugins) demora bem mais pra ficar pronto do que o container
      # leva pra existir — sem isso, quem depende de "broker" sobe antes da hora e cai com
      # "Connection refused" (ver docs/todo.md).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Simulação de serviços externos instáveis
  pagamento-externo:
    build:
      context: .
      dockerfile: pagamento-externo/Dockerfile
    env_file:
      - .env
    ports:
      - "${PAGAMENTO_EXTERNO_PORT}:${PAGAMENTO_EXTERNO_PORT}"
    depends_on:
      - db
  
  reservas-externo-hotel:
    build:
      context: .
      dockerfile: reservas-externo/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_EXTERNO_HOTEL_PORT}:${RESERVAS_EXTERNO_HOTEL_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: hotel
    depends_on:
      - db
  
  reservas-externo-voo:
    build:
      context: .
      dockerfile: reservas-externo/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_EXTERNO_VOO_PORT}:${RESERVAS_EXTERNO_VOO_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: voo
    depends_on:
      - db

  # Serviços internos da aplicação
  clientes:
    build:
      context: .
      dockerfile: clientes/Dockerfile
    env_file:
      - .env
    ports:
      - "${CLIENTES_PORT}:${CLIENTES_PORT}"
    depends_on:
      - db

  pagamento-interno-web:
    build:
      context: .
      dockerfile: pagamento-interno/Dockerfile
    env_file:
      - .env
    ports:
      - "${PAGAMENTO_INTERNO_PORT}:${PAGAMENTO_INTERNO_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: web
    depends_on:
      db:
        condition: service_started
      broker:
        condition: service_healthy

  reservas-interno-hotel-web:
    build:
      context: .
      dockerfile: reservas-interno/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_INTERNO_WEB_HOTEL_PORT}:${RESERVAS_INTERNO_WEB_HOTEL_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: hotel,web
    depends_on:
      - db

  reservas-interno-voo-web:
    build:
      context: .
      dockerfile: reservas-interno/Dockerfile
    env_file:
      - .env
    ports:
      - "${RESERVAS_INTERNO_WEB_VOO_PORT}:${RESERVAS_INTERNO_WEB_VOO_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: voo,web
    depends_on:
      - db

  sessaocompra-web:
    build:
      context: .
      dockerfile: sessaocompra/Dockerfile
    env_file:
      - .env
    ports:
      - "${SESSAO_COMPRA_WEB_PORT}:${SESSAO_COMPRA_WEB_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: web
    depends_on:
      - db

  # Serviços SAGAS
  reservas-interno-hotel-sagas:
    build:
      context: .
      dockerfile: reservas-interno/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: hotel,sagas
    depends_on:
      db:
        condition: service_started
      broker:
        condition: service_healthy
    restart: on-failure

  reservas-interno-voo-sagas:
    build:
      context: .
      dockerfile: reservas-interno/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: voo,sagas
    depends_on:
      db:
        condition: service_started
      broker:
        condition: service_healthy
    restart: on-failure

  pagamento-interno-sagas:
    build:
      context: .
      dockerfile: pagamento-interno/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: sagas
    depends_on:
      db:
        condition: service_started
      broker:
        condition: service_healthy
    restart: on-failure

  # Timeout de limpeza de reservas não confirmadas
  sessaocompra-timeout:
    build:
      context: .
      dockerfile: sessaocompra/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: timeout
    depends_on:
      - db

volumes:
  # Volumes nomeados (não bind mount): o dado fica dentro do storage do Docker,
  # não num diretório do host — evita depender de permissão/uid do host pra montar,
  # o que muda conforme o backend (dockerd nativo como root vs. proxy do Docker Desktop).
  pgdata:
  rabbitmqdata:
