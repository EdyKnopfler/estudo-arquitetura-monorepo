server:
  port: ${RESERVAS_INTERNO_WEB_HOTEL_PORT:8084}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/interno_hotel
    hikari:
      pool-name: InternoHotelPool

# para ACEITAR requisições
internal-backend:
  clients:
    - client-id: ${RESERVAS_INTERNO_WEB_HOTEL_ID:reservasExternoHotelId}
      client-secret: ${RESERVAS_INTERNO_WEB_HOTEL_SECRET:reservasExternoHotelId}

# para SOLICITAR ao serviço externo
external-backend:
  url: http://${RESERVAS_EXTERNO_HOTEL_HOST:localhost}:${RESERVAS_EXTERNO_HOTEL_PORT:8082}
  client-id: ${RESERVAS_EXTERNO_HOTEL_ID:reservasExternoHotelId}
  client-secret: ${RESERVAS_EXTERNO_HOTEL_SECRET:reservasExternoHotelSecret}