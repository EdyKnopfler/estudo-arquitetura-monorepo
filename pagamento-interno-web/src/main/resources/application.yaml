server:
  port: ${PAGAMENTO_INTERNO_PORT:8087}

spring:
  application:
    name: pagamento-interno-web

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/interno_pagamento
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: InternoPagamentoPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

    show-sql: true

  flyway:
    enabled: true
    validate-on-migrate: true

# para ACEITAR requisições
internal-backend:
  clients:
    - client-id: ${FRONT_END_ID}:frontEndId}
      client-secret: ${FRONT_END_SECRET}:frontEndId}
    - client-id: ${PAGAMENTO_EXTERNO_ID}:pagamentoExternoId}
      client-secret: ${PAGAMENTO_EXTERNO_SECRET}:pagamentoExternoSecret}

# para SOLICITAR ao serviço externo (que por coincidência usa a mesma chave em dev)
external-backend:
  url: http://${PAGAMENTO_EXTERNO_HOST:localhost}:${PAGAMENTO_EXTERNO_PORT:8086}
  client-id: ${PAGAMENTO_INTERNO_ID}:pagamentoInternoId}
  client-secret: ${PAGAMENTO_INTERNO_SECRET}:pagamentoInternoSecret}
