spring:
  application:
    name: reservas-interno

  threads:
    virtual:
      enabled: true

  datasource:
    # url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/...
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # pool-name: ...

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

    show-sql: true

  flyway:
    enabled: true
    validate-on-migrate: true

security:
  auth-type: client-secret

sagas:
  rabbithost: ${BROKER_HOST:localhost}
  rabbitport: ${BROKER_PORT:5672}
  rabbituser: ${BROKER_USER:cueio}
  rabbitpassword: ${BROKER_PASSWORD:cueio}
